<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027 미국 가족여행</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <div class="hero-content">
    <p class="eyebrow">2027 FAMILY TRIP</p>
    <h1>🇺🇸 미국 가족여행</h1>
    <p>LA · Las Vegas · San Diego</p>
    <p class="date">2027.01.30 — 2027.02.10</p>
  </div>
</header>

<nav class="nav">
  <button class="nav-btn active" onclick="showPage('schedule', this)">📅 일정</button>
  <button class="nav-btn" onclick="showPage('hotels', this)">🏨 호텔</button>
  <button class="nav-btn" onclick="showPage('notes', this)">📝 메모</button>
</nav>

<main>

  <!-- 일정 -->
  <section id="schedule" class="page active">
    <div class="section-title">
      <div>
        <h2>📅 여행 일정</h2>
        <p>날짜를 눌러 일정을 수정할 수 있어.</p>
      </div>
      <button class="primary-btn" onclick="addTrip()">＋ 일정 추가</button>
    </div>

    <div id="trip-list"></div>
  </section>


  <!-- 호텔 -->
  <section id="hotels" class="page">

    <div class="section-title">
      <div>
        <h2>🏨 호텔 정보</h2>
        <p>지역별 숙소를 정리해 놓았어.</p>
      </div>

      <button class="primary-btn" onclick="addHotel()">＋ 호텔 추가</button>
    </div>

    <div id="hotel-list" class="hotel-grid"></div>

  </section>


  <!-- 메모 -->
  <section id="notes" class="page">

    <div class="section-title">
      <div>
        <h2>📝 여행 메모</h2>
        <p>준비할 것과 중요한 내용을 적어둘 수 있어.</p>
      </div>
    </div>

    <textarea
      id="notes"
      class="notes"
      placeholder="여행 준비물, 예약 정보, 가족들과 상의할 내용 등을 적어보세요."
      oninput="saveNotes()"
    ></textarea>

    <div class="note-info">
      💾 입력한 내용은 이 브라우저에 자동 저장돼.
    </div>

  </section>

</main>


<!-- 일정 수정 창 -->
<div id="trip-modal" class="modal">
  <div class="modal-box">

    <div class="modal-header">
      <h2 id="trip-modal-title">일정 수정</h2>
      <button onclick="closeTripModal()">×</button>
    </div>

    <label>날짜</label>
    <input type="date" id="trip-date">

    <label>지역</label>
    <input type="text" id="trip-city" placeholder="예: LA">

    <label>일정</label>
    <input type="text" id="trip-title" placeholder="예: Universal Studios">

    <label>상세 내용</label>
    <textarea id="trip-details" placeholder="자세한 일정을 입력하세요"></textarea>

    <label>교통</label>
    <input type="text" id="trip-transport" placeholder="예: Metro / Uber">

    <label>시간</label>
    <input type="text" id="trip-time" placeholder="예: 09:00 ~ 18:00">

    <div class="modal-buttons">
      <button class="delete-btn" onclick="deleteTrip()">삭제</button>
      <button class="cancel-btn" onclick="closeTripModal()">취소</button>
      <button class="primary-btn" onclick="saveTrip()">저장</button>
    </div>

  </div>
</div>


<!-- 호텔 수정 창 -->
<div id="hotel-modal" class="modal">
  <div class="modal-box">

    <div class="modal-header">
      <h2 id="hotel-modal-title">호텔 수정</h2>
      <button onclick="closeHotelModal()">×</button>
    </div>

    <label>지역</label>
    <input type="text" id="hotel-city" placeholder="예: Los Angeles">

    <label>호텔 이름</label>
    <input type="text" id="hotel-name" placeholder="호텔 이름">

    <label>주소</label>
    <input type="text" id="hotel-address" placeholder="호텔 주소">

    <label>가격</label>
    <input type="text" id="hotel-price" placeholder="예: 1박 $150">

    <label>숙박 날짜</label>
    <input type="text" id="hotel-dates" placeholder="예: 1/30 ~ 2/3">

    <label>예약 링크</label>
    <input type="url" id="hotel-link" placeholder="https://">

    <label>메모</label>
    <textarea id="hotel-notes" placeholder="주차, 조식, 위치 등의 메모"></textarea>

    <div class="modal-buttons">
      <button class="delete-btn" onclick="deleteHotel()">삭제</button>
      <button class="cancel-btn" onclick="closeHotelModal()">취소</button>
      <button class="primary-btn" onclick="saveHotel()">저장</button>
    </div>

  </div>
</div>


<footer>
  <p>🇺🇸 2027 미국 가족여행 플래너</p>
  <p>LA · Las Vegas · San Diego</p>
</footer>

<script src="script.js"></script>

</body>
</html>
