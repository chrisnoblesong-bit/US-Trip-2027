
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 미국 가족 여행</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5fa;color:#202b40;font-family:Arial,sans-serif}
header{background:#172b4d;color:white;padding:25px 18px}
header h1{margin:0 0 8px;font-size:25px}
header p{margin:0;color:#cbd7e9}
nav{display:flex;gap:8px;padding:12px;background:white;position:sticky;top:0;z-index:5;overflow-x:auto}
nav button{white-space:nowrap;border:0;background:#edf1f7;padding:12px 17px;border-radius:9px;font-weight:bold}
nav button.active{background:#2456a6;color:white}
main{max-width:1050px;margin:22px auto;padding:0 14px}
.panel{display:none}
.panel.active{display:block}
.card{background:white;padding:19px;border-radius:14px;margin-bottom:15px;box-shadow:0 2px 10px #172b4d0c}
h2{font-size:21px;margin-top:0}
h3{margin:0 0 12px}
input,textarea,select{width:100%;padding:12px;border:1px solid #d5dce8;border-radius:8px;margin:6px 0 13px;font-size:15px}
textarea{min-height:85px;resize:vertical}
label{font-size:13px;font-weight:bold}
button{cursor:pointer}
.primary{background:#2456a6;color:white;border:0;padding:12px 17px;border-radius:9px;font-weight:bold}
.danger{background:#fff0f0;color:#c43b3b;border:0;padding:9px 12px;border-radius:8px}
.secondary{background:#edf1f7;color:#263b5c;border:0;padding:9px 12px;border-radius:8px}
.hotel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.hotel img{width:100%;height:170px;object-fit:cover;border-radius:10px;background:#edf1f7}
.hotel p{line-height:1.6;color:#56647a;overflow-wrap:anywhere}
.hotel-actions{display:flex;gap:8px;flex-wrap:wrap}
.hotel-actions a{background:#2456a6;color:white;padding:9px 12px;border-radius:8px;text-decoration:none;font-size:13px}
.empty{color:#7d899c;text-align:center;padding:30px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.day{border-left:4px solid #3976c8}
.day small{color:#718096}
footer{text-align:center;color:#8993a4;padding:25px}
@media(max-width:600px){
 header h1{font-size:21px}
 .row{grid-template-columns:1fr}
 main{padding:0 10px}
 .card{padding:15px}
}
</style>
</head>
<body>

<header>
<h1>🇺🇸 2027 미국 가족 여행</h1>
<p>2027.01.30 ~ 2027.02.10 | LA · 라스베이거스 · 그랜드캐니언 · 샌디에이고</p>
</header>

<nav>
<button class="active" onclick="showTab('schedule',this)">📅 여행 일정</button>
<button onclick="showTab('hotels',this)">🏨 호텔 목록</button>
<button onclick="showTab('memo',this)">📝 여행 메모</button>
</nav>

<main>

<section id="schedule" class="panel active">
<div class="card">
<h2>📅 여행 일정</h2>
<p>일정을 자유롭게 추가하고 수정하거나 삭제할 수 있어.</p>
<button class="primary" onclick="addDay()">＋ 일정 추가</button>
</div>
<div id="scheduleList"></div>
</section>

<section id="hotels" class="panel">
<div class="card">
<h2>🏨 나의 호텔 목록</h2>
<p>여행 중 이용할 호텔을 직접 추가하고 관리해 봐.</p>
<button class="primary" onclick="openHotelForm()">＋ 호텔 추가하기</button>
</div>

<div id="hotelForm" class="card" style="display:none">
<h2 id="formTitle">새 호텔 등록</h2>
<input type="hidden" id="editId">

<label>호텔 이름</label>
<input id="hotelName" placeholder="예: Best Western Plus L.A. Midtown">

<label>도시 / 지역</label>
<select id="hotelCity">
<option>로스앤젤레스</option>
<option>라스베이거스</option>
<option>그랜드캐니언</option>
<option>샌디에이고</option>
<option>기타</option>
</select>

<label>호텔 주소</label>
<input id="hotelAddress" placeholder="호텔 주소">

<div class="row">
<div>
<label>체크인</label>
<input type="date" id="checkin">
</div>
<div>
<label>체크아웃</label>
<input type="date" id="checkout">
</div>
</div>

<div class="row">
<div>
<label>1박 가격 (원)</label>
<input type="number" id="hotelPrice" placeholder="150000">
</div>
<div>
<label>총 숙박비 (원)</label>
<input type="number" id="totalPrice" placeholder="300000">
</div>
</div>

<label>호텔 사진 URL</label>
<input id="hotelImage" placeholder="https://...">

<label>예약 사이트 링크</label>
<input id="hotelLink" placeholder="https://...">

<label>호텔 설명 및 특징</label>
<textarea id="hotelDescription" placeholder="객실, 위치, 교통, 조식, 장점 등을 작성해 줘."></textarea>

<label>추가 메모</label>
<textarea id="hotelMemo" placeholder="예약번호, 요청사항 등"></textarea>

<div class="hotel-actions">
<button class="primary" onclick="saveHotel()">저장하기</button>
<button class="secondary" onclick="closeHotelForm()">취소</button>
</div>
</div>

<div id="hotelList" class="hotel-grid"></div>
</section>

<section id="memo" class="panel">
<div class="card">
<h2>📝 여행 메모</h2>
<textarea id="generalMemo" placeholder="준비물, 예약 정보, 여행 중 필요한 내용 등을 작성해 줘."></textarea>
<button class="primary" onclick="saveMemo()">메모 저장</button>
<p id="memoStatus"></p>
</div>
</section>

</main>

<footer>2027 USA FAMILY TRIP</footer>

<script>
const getData=(key, fallback)=>{
try{return JSON.parse(localStorage.getItem(key)) ?? fallback}
catch{return fallback}
};

let hotels=getData("usaHotels",[]);
let days=getData("usaDays",[
{date:"2027-01-30",title:"LA 입국 및 할리우드",memo:"07:20 LA 도착 · 호텔 체크인 · 할리우드 거리 · 그리피스 천문대"},
{date:"2027-01-31",title:"산타모니카 & 베니스",memo:"산타모니카 해변과 베니스 비치"},
{date:"2027-02-01",title:"유니버설 스튜디오",memo:"해리포터 및 주요 어트랙션"},
{date:"2027-02-02",title:"할리우드 & 게티",memo:"할리우드 관광 및 게티 센터"},
{date:"2027-02-03",title:"그랜드캐니언 투어",memo:"LA 출발 · 라스베이거스 경유"},
{date:"2027-02-04",title:"그랜드캐니언",memo:"그랜드캐니언 관광"},
{date:"2027-02-05",title:"투어 종료",memo:"LA 또는 샌디에이고 이동"},
{date:"2027-02-06",title:"샌디에이고",memo:"리틀이탈리 · 항구"},
{date:"2027-02-07",title:"라호야",memo:"라호야 해변 관광"},
{date:"2027-02-08",title:"LA 이동",memo:"샌디에이고에서 LA 이동"},
{date:"2027-02-09",title:"LA 마지막 여행",memo:"쇼핑 및 자유 일정"},
{date:"2027-02-10",title:"한국 귀국",memo:"09:50 출발"}
]);

function persist(){
localStorage.setItem("usaHotels",JSON.stringify(hotels));
localStorage.setItem("usaDays",JSON.stringify(days));
}

function showTab(id,btn){
document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
document.getElementById(id).classList.add("active");
document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
}

function renderHotels(){
const list=document.getElementById("hotelList");
if(!hotels.length){
list.innerHTML='<div class="card empty">아직 등록된 호텔이 없어.<br>＋ 호텔 추가하기를 눌러 등록해 줘.</div>';
return;
}
list.innerHTML=hotels.map(h=>`
<div class="card hotel">
${h.image?`<img src="${esc(h.image)}" alt="호텔 사진" onerror="this.style.display='none'">`:""}
<h3>${esc(h.name)}</h3>
<p>📍 ${esc(h.city)}<br>
${esc(h.address)}<br>
🗓️ ${esc(h.checkin||"-")} ~ ${esc(h.checkout||"-")}<br>
💰 1박: ${money(h.price)}<br>
💳 총 숙박비: ${money(h.total)}</p>
<p>${esc(h.description).replace(/\n/g,"<br>")}</p>
${h.memo?`<p>📝 ${esc(h.memo).replace(/\n/g,"<br>")}</p>`:""}
<div class="hotel-actions">
${h.link?`<a href="${safeUrl(h.link)}" target="_blank" rel="noopener noreferrer">예약 사이트</a>`:""}
<button class="secondary" onclick="editHotel('${h.id}')">수정</button>
<button class="danger" onclick="deleteHotel('${h.id}')">삭제</button>
</div>
</div>`).join("");
}

function esc(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}
function safeUrl(value){
try{
const u=new URL(value);
return ["http:","https:"].includes(u.protocol)?esc(u.href):"#";
}catch{return "#"}
}
function money(value){
return value?Number(value).toLocaleString("ko-KR")+"원":"미입력";
}
function openHotelForm(){
document.getElementById("hotelForm").style.display="block";
document.getElementById("formTitle").textContent="새 호텔 등록";
document.getElementById("editId").value="";
["hotelName","hotelAddress","checkin","checkout","hotelPrice","totalPrice","hotelImage","hotelLink","hotelDescription","hotelMemo"].forEach(id=>document.getElementById(id).value="");
document.getElementById("hotelCity").selectedIndex=0;
document.getElementById("hotelForm").scrollIntoView({behavior:"smooth"});
}
function closeHotelForm(){
document.getElementById("hotelForm").style.display="none";
}
function saveHotel(){
const name=document.getElementById("hotelName").value.trim();
if(!name){alert("호텔 이름을 입력해 줘.");return}
const id=document.getElementById("editId").value||String(Date.now());
const old=hotels.find(h=>h.id===id);
const h={
id,name,
city:document.getElementById("hotelCity").value,
address:document.getElementById("hotelAddress").value,
checkin:document.getElementById("checkin").value,
checkout:document.getElementById("checkout").value,
price:document.getElementById("hotelPrice").value,
total:document.getElementById("totalPrice").value,
image:document.getElementById("hotelImage").value,
link:document.getElementById("hotelLink").value,
description:document.getElementById("hotelDescription").value,
memo:document.getElementById("hotelMemo").value
};
if(old)hotels=hotels.map(x=>x.id===id?h:x);
else hotels.push(h);
persist();
renderHotels();
closeHotelForm();
alert("호텔이 저장되었어!");
}
function editHotel(id){
const h=hotels.find(x=>x.id===id);
if(!h)return;
openHotelForm();
document.getElementById("formTitle").textContent="호텔 정보 수정";
document.getElementById("editId").value=h.id;
const fields={
hotelName:"name",hotelAddress:"address",checkin:"checkin",
checkout:"checkout",hotelPrice:"price",totalPrice:"total",
hotelImage:"image",hotelLink:"link",
hotelDescription:"description",hotelMemo:"memo"
};
Object.entries(fields).forEach(([input,key])=>{
document.getElementById(input).value=h[key]||"";
});
document.getElementById("hotelCity").value=h.city;
}
function deleteHotel(id){
if(!confirm("이 호텔을 삭제할까?"))return;
hotels=hotels.filter(h=>h.id!==id);
persist();
renderHotels();
}
function renderDays(){
const list=document.getElementById("scheduleList");
list.innerHTML=days.map((d,i)=>`
<div class="card day">
<small>${esc(d.date)}</small>
<h3>${esc(d.title)}</h3>
<textarea id="daymemo${i}" aria-label="일정 내용">${esc(d.memo)}</textarea>
<div class="hotel-actions">
<button class="primary" onclick="saveDay(${i})">일정 저장</button>
<button class="secondary" onclick="editDay(${i})">제목 수정</button>
<button class="danger" onclick="deleteDay(${i})">삭제</button>
</div>
</div>`).join("");
}
function saveDay(i){
days[i].memo=document.getElementById("daymemo"+i).value;
persist();
alert("일정을 저장했어!");
}
function editDay(i){
const title=prompt("일정 제목",days[i].title);
if(title===null)return;
const date=prompt("날짜 (YYYY-MM-DD)",days[i].date);
if(date===null)return;
days[i].title=title;
days[i].date=date;
persist();
renderDays();
}
function addDay(){
const date=prompt("날짜 (YYYY-MM-DD)");
if(!date)return;
const title=prompt("일정 제목");
if(!title)return;
days.push({date,title,memo:""});
days.sort((a,b)=>a.date.localeCompare(b.date));
persist();
renderDays();
}
function deleteDay(i){
if(!confirm("이 일정을 삭제할까?"))return;
days.splice(i,1);
persist();
renderDays();
}
function saveMemo(){
localStorage.setItem("usaGeneralMemo",document.getElementById("generalMemo").value);
document.getElementById("memoStatus").textContent="저장 완료!";
}
document.getElementById("generalMemo").value=localStorage.getItem("usaGeneralMemo")||"";
renderHotels();
renderDays();
</script>
</body>
</html>
